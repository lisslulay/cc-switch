name: Windows compatibility build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CC_SWITCH_TEST_HOME: ${{ runner.temp }}/cc-switch-test-home
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Read pinned Rust toolchain
        id: rust-toolchain
        shell: bash
        run: |
          channel=$(sed -nE 's/^channel *= *"([^"]+)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ steps.rust-toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src-tauri -> target
          shared-key: windows-compat

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Build frontend
        run: pnpm build:renderer

      - name: Check backend
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Test native Responses compatibility
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib native_responses_compat

      - name: Test existing native Responses and Chat compatibility
        shell: pwsh
        run: |
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib native_grok_compat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib responses_request_to_chat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows executable
        run: pnpm tauri build --no-bundle

      - name: Record executable checksum
        shell: pwsh
        run: |
          $executable = 'src-tauri/target/release/cc-switch.exe'
          $checksum = (Get-FileHash -LiteralPath $executable -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  cc-switch.exe" | Set-Content -LiteralPath 'src-tauri/target/release/SHA256SUMS.txt' -Encoding ascii

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: cc-switch-windows-x64-${{ github.sha }}
          path: |
            src-tauri/target/release/cc-switch.exe
            src-tauri/target/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
